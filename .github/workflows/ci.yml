name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs when a new run is triggered on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reusable environment variables
env:
  NODE_VERSION: "22"
  # Required by prisma.config.ts during postinstall / generate / build.
  # CI uses an ephemeral Postgres-compatible URL so the build does not crash.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/metavoice?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/metavoice?schema=public"
  # API keys are not used in CI tests, but must be non-empty placeholders.
  DASHSCOPE_API_KEY: "ci-placeholder"
  NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
  SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
  # Optional application URLs / keys.
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  OPENAI_API_KEY: "ci-placeholder"
  # Skip Next.js runtime env validation where present.
  NEXT_SKIP_ENV_VALIDATION: "1"
  # Force deterministic install behavior.
  CI: "true"

jobs:
  ci:
    name: Lint / Type Check / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # ------------------------------------------------------------------
      # Cache .next + Prisma generated client to speed up repeat builds.
      # ------------------------------------------------------------------
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .next
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      # ------------------------------------------------------------------
      # Install dependencies.
      # `npm ci` is strict; if it fails due to lock-file drift we fail fast
      # and print diagnostics so the error is actionable.
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          npm ci

      # ------------------------------------------------------------------
      # Prisma Client is generated in postinstall, but regenerate explicitly
      # in case the cache restored an outdated client.
      # ------------------------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # ------------------------------------------------------------------
      # Lint
      # ------------------------------------------------------------------
      - name: Run ESLint
        run: npm run lint

      # ------------------------------------------------------------------
      # Type check (Next.js build also checks types, but keep explicit step)
      # ------------------------------------------------------------------
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ------------------------------------------------------------------
      # Unit tests. Vitest is configured in vitest.config.ts.
      # ------------------------------------------------------------------
      - name: Run tests
        run: npm run test

      # ------------------------------------------------------------------
      # Production build. prisma generate is part of the build script.
      # ------------------------------------------------------------------
      - name: Build
        run: npm run build

      # ------------------------------------------------------------------
      # Upload build artifacts for inspection / downstream jobs.
      # ------------------------------------------------------------------
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next
            package-lock.json
          retention-days: 3
