services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: metavoice-db
    environment:
      POSTGRES_USER: metavoice
      POSTGRES_PASSWORD: metavoice_password
      POSTGRES_DB: metavoice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metavoice"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: metavoice-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://metavoice:metavoice_password@postgres:5432/metavoice"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
